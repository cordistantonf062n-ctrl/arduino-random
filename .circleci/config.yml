version: 2.1

jobs:
  cacher_test:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: satin finish
          command: |
            mkdir -p /tmp/outbox
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=1024 count=300 2>/dev/null | base64 > /tmp/outbox/ckpt-A.state; true
            len=$(wc -c </tmp/outbox/ckpt-A.state); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/outbox
          paths:
            - ckpt-A.state
  test:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/outbox
      - run:
          name: Inherit stage
          command: |
            du -b /tmp/outbox/FINAL.txt || true
      - run:
          name: Get project
          command: git clone --depth 5 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Prepare source archive
          command: tar --extract --file=build-cache.tar
      - run:
          no_output_timeout: 85m
          command: sh -c "./job"
  drain_ed-run:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/outbox
      - run:
          name: more flaky
          command: |
            mkdir -p /tmp/outbox
